name: Android SDK arm64 build check

on:
  workflow_dispatch:
  push:
    branches:
      - android-arm64
    paths:
      - "patches/rexglue-sdk-bd833a2-veronicax.patch"
      - "patches/rexglue-sdk-bd833a2-android.patch"
      - "scripts/check-android-sdk-build.sh"
      - ".github/workflows/android-sdk-build-check.yml"

permissions:
  contents: read

jobs:
  build-android-sdk:
    runs-on: ubuntu-24.04
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Check out Project-VeronicaX
        uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y git ninja-build
      - name: Install Android NDK and CMake
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" --install "ndk;27.2.12479018" "cmake;3.31.1"
      - name: Add Android CMake to PATH
        run: echo "$ANDROID_HOME/cmake/3.31.1/bin" >> "$GITHUB_PATH"
      - name: Configure and compile ReXGlue for Android arm64-v8a
        run: bash scripts/check-android-sdk-build.sh
