name: Android host Codegen check

on:
  workflow_dispatch:
  push:
    branches:
      - android-arm64
    paths:
      - '.github/workflows/android-codegen-check.yml'
      - 'config/functions.toml'
      - 'config/gaps.toml'

permissions:
  contents: read

jobs:
  codegen:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Project-VeronicaX
        uses: actions/checkout@v4
        with:
          ref: android-arm64
          submodules: recursive

      - name: Checkout private game input
        uses: actions/checkout@v4
        with:
          repository: marcuscastrooutlok-web/recvx-private-build
          ref: veronicax-game-input
          token: ${{ secrets.VERONICAX_GAME_REPO_TOKEN }}
          path: private-game-input
          sparse-checkout: |
            game/Default.xex
          sparse-checkout-cone-mode: false

      - name: Verify and stage private XEX
        shell: bash
        run: |
          set -euo pipefail
          test -s private-game-input/game/Default.xex
          mkdir -p game/extracted
          install -m 600 private-game-input/game/Default.xex game/extracted/Default.xex
          echo "XEX size: $(stat -c '%s' game/extracted/Default.xex) bytes"
          sha256sum game/extracted/Default.xex
          test "$(sha256sum game/extracted/Default.xex | cut -d' ' -f1)" = "c552c6995462a5cefdd52c07bebd28fff4481164b19a445c636d7b54736f3c70"

      - name: Install host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang ninja-build cmake pkg-config g++-14 libstdc++-14-dev \
            libx11-xcb-dev libwayland-dev libxkbcommon-dev libegl1-mesa-dev \
            libdrm-dev libgbm-dev libudev-dev libusb-1.0-0-dev \
            libthai-dev

      - name: Checkout pinned ReXGlue SDK
        run: |
          set -euo pipefail
          mkdir -p thirdparty
          git clone https://github.com/rexglue/rexglue-sdk.git thirdparty/rexglue-sdk
          git -C thirdparty/rexglue-sdk checkout bd833a2
          git -C thirdparty/rexglue-sdk submodule update --init --recursive

      - name: Add temporary XEX branch-target diagnostics to pinned SDK
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("thirdparty/rexglue-sdk/src/codegen/project_recompiler.cpp")
          s = p.read_text()
          needle = "    contexts.push_back({std::move(ctx), &targeted[0], std::move(entry_display)});"
          diagnostic = r"""
              // Temporary VeronicaX diagnostic: dump loaded PPC words around unresolved targets.
              {
                constexpr uint32_t targets[] = {
                    0x827E9A60, 0x829E2470, 0x823D1438, 0x829E2458, 0x82221830,
                    0x82B85AE8, 0x828A7E40, 0x829E2244, 0x8281D028};
                const auto& binary = ctx.binary();
                for (uint32_t target : targets) {
                  REXCODEGEN_WARN("VX_DISASM target=0x{:08X}", target);
                  for (int32_t delta = -32; delta <= 32; delta += 4) {
                    uint32_t address = static_cast<uint32_t>(target + delta);
                    const uint8_t* bytes = binary.translate(address);
                    if (!bytes) {
                      REXCODEGEN_WARN("VX_DISASM 0x{:08X}: <unmapped>", address);
                      continue;
                    }
                    REXCODEGEN_WARN("VX_DISASM 0x{:08X}: {:02X}{:02X}{:02X}{:02X}",
                                    address, bytes[0], bytes[1], bytes[2], bytes[3]);
                  }
                }
              }
          """
          if s.count(needle) != 1:
              raise SystemExit("Could not uniquely locate entry CodegenContext insertion point")
          p.write_text(s.replace(needle, diagnostic + "\n" + needle))
          print("Inserted temporary loaded-XEX branch-target diagnostics.")
          PY

      - name: Build pinned ReXGlue host codegen
        working-directory: thirdparty/rexglue-sdk
        run: |
          set -euo pipefail
          # Clang 18 advertises an older concepts feature level than libstdc++ 14 expects.
          # Verify and enable the C++23 library feature gate for std::expected.
          printf '#include <expected>\nint main() { std::expected<int, int> value = 1; return value.value() - 1; }\n' | \
            clang++ --gcc-toolchain=/usr -stdlib=libstdc++ -std=c++23 -D__cpp_concepts=202002L -x c++ -fsyntax-only -
          clang++ --gcc-toolchain=/usr -v -E -x c++ /dev/null -o /dev/null
          cmake --preset linux-amd64 \
            -DCMAKE_CXX_FLAGS="--gcc-toolchain=/usr -march=x86-64-v2 -stdlib=libstdc++ -D__cpp_concepts=202002L" \
            -DCMAKE_EXE_LINKER_FLAGS="--gcc-toolchain=/usr -stdlib=libstdc++" \
            -DCMAKE_SHARED_LINKER_FLAGS="--gcc-toolchain=/usr -stdlib=libstdc++"
          cmake --build --preset linux-amd64-release --target rexglue --parallel 2

      - name: Run VeronicaX codegen
        shell: bash
        run: |
          set -euo pipefail
          SDK_BIN="thirdparty/rexglue-sdk/out/linux-amd64/Release/rexglue"
          if [[ ! -x "$SDK_BIN" ]]; then
            SDK_BIN="thirdparty/rexglue-sdk/out/linux-amd64/rexglue"
          fi
          test -x "$SDK_BIN"
          "$SDK_BIN" codegen veronicax_manifest.toml

      - name: Verify generated CMake and sources
        shell: bash
        run: |
          set -euo pipefail
          test -s generated/default/sources.cmake
          test -s generated/default/codegen.build.stamp
          test -s generated/default/veronicax_pch.h
          grep -q 'set(GENERATED_SOURCES' generated/default/sources.cmake
          echo "Codegen output verified."
          find generated/default -maxdepth 1 -type f -printf '%f %s bytes\\n' | sort

      - name: Remove private game input
        if: always()
        run: |
          rm -rf private-game-input game/extracted/Default.xex
