name: Android host Codegen check

on:
  workflow_dispatch:
  push:
    branches:
      - android-arm64
    paths:
      - '.github/workflows/android-codegen-check.yml'
      - 'veronicax_manifest.toml'
      - 'config/**'
      - 'scripts/codegen.sh'
      - 'scripts/find_gaps.py'
      - 'scripts/refine_gaps.py'
      - 'scripts/scan_gaps.sh'
      - 'scripts/check-android-sdk-build.sh'
      - 'patches/rexglue-sdk-bd833a2-codegen-gapfill.patch'
      - 'notes/functions.md'

permissions:
  contents: read

jobs:
  codegen:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Project-VeronicaX
        uses: actions/checkout@v4
        with:
          ref: android-arm64
          submodules: recursive

      - name: Checkout private game input
        uses: actions/checkout@v4
        with:
          repository: marcuscastrooutlok-web/recvx-private-build
          ref: veronicax-game-input
          token: ${{ secrets.VERONICAX_GAME_REPO_TOKEN }}
          path: private-game-input
          sparse-checkout: |
            game/Default.xex
          sparse-checkout-cone-mode: false

      - name: Verify and stage private XEX
        shell: bash
        run: |
          set -euo pipefail
          test -s private-game-input/game/Default.xex
          mkdir -p game/extracted
          install -m 600 private-game-input/game/Default.xex game/extracted/Default.xex
          echo "XEX size: $(stat -c '%s' game/extracted/Default.xex) bytes"
          sha256sum game/extracted/Default.xex
          test "$(sha256sum game/extracted/Default.xex | cut -d' ' -f1)" = "c552c6995462a5cefdd52c07bebd28fff4481164b19a445c636d7b54736f3c70"

      - name: Install host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang ninja-build cmake pkg-config g++-14 libstdc++-14-dev \
            libx11-xcb-dev libwayland-dev libxkbcommon-dev libegl1-mesa-dev \
            libdrm-dev libgbm-dev libudev-dev libusb-1.0-0-dev \
            libthai-dev

      - name: Checkout pinned ReXGlue SDK
        run: |
          set -euo pipefail
          mkdir -p thirdparty
          git clone https://github.com/rexglue/rexglue-sdk.git thirdparty/rexglue-sdk
          git -C thirdparty/rexglue-sdk checkout bd833a2
          git -C thirdparty/rexglue-sdk submodule update --init --recursive

      - name: Apply VeronicaX codegen GAP_FILL fix to pinned SDK
        shell: bash
        run: |
          set -euo pipefail
          PATCH="$GITHUB_WORKSPACE/patches/rexglue-sdk-bd833a2-codegen-gapfill.patch"
          git -C thirdparty/rexglue-sdk apply --check "$PATCH"
          git -C thirdparty/rexglue-sdk apply "$PATCH"
          git -C thirdparty/rexglue-sdk diff --check
          echo "Applied GAP_FILL interval-protection patch to bd833a2."
          
      - name: Add code-region and GAP_FILL target diagnostics
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("thirdparty/rexglue-sdk/src/codegen/phase_gapfill.cpp")
          s = p.read_text()
          needle = '  size_t gapsFound = 0;\n  size_t segmentsCreated = 0;\n'
          diag = r'''  // Temporary VeronicaX target classification: code/data regions and split segments.
            constexpr uint32_t vxTargets[] = {0x829E2470, 0x82221830, 0x82B85AE8,
                0x828A7E40, 0x829E2458, 0x829E2244};
            for (uint32_t target : vxTargets) {
              bool inCode = false, inData = false;
              for (const auto& r : scan.codeRegions) {
                if (target >= r.start && target < r.end) {
                  inCode = true;
                  REXCODEGEN_WARN("VX_REGION target=0x{:08X} code=[0x{:08X},0x{:08X})", target, r.start, r.end);
                }
              }
              for (const auto& r : scan.dataRegions) {
                if (target >= r.first && target < r.second) {
                  inData = true;
                  REXCODEGEN_WARN("VX_REGION target=0x{:08X} data=[0x{:08X},0x{:08X})", target, r.first, r.second);
                }
              }
              REXCODEGEN_WARN("VX_REGION target=0x{:08X} in_code={} in_data={} entry={} owner={}",
                  target, inCode, inData, graph.isEntryPoint(target),
                  graph.getFunctionContaining(target) ? graph.getFunctionContaining(target)->base() : 0);
            }
          '''
          if s.count(needle) != 1:
              raise SystemExit("Could not find unique GAP_FILL counters insertion point")
          s = s.replace(needle, needle + diag)
          needle2 = '    auto segments = splitRegionOnTerminators(region, binary, knownCallables);\n'
          diag2 = r'''    for (uint32_t target : vxTargets) {
              if (target >= region.start && target < region.end) {
                REXCODEGEN_WARN("VX_PARENT target=0x{:08X} parent=[0x{:08X},0x{:08X})", target, region.start, region.end);
              }
            }
            for (const auto& segment : segments) {
              for (uint32_t target : vxTargets) {
                if (target >= segment.start && target < segment.end) {
                  REXCODEGEN_WARN("VX_FINAL_SEGMENT target=0x{:08X} segment=[0x{:08X},0x{:08X})", target, segment.start, segment.end);
                }
              }
            }
            for (const auto& segment : segments) {
              auto candidates = subtractProtectedRanges(segment);
              for (uint32_t target : vxTargets) {
                if (target < segment.start || target >= segment.end) continue;
                bool covered = false;
                for (const auto& candidate : candidates) {
                  if (target >= candidate.start && target < candidate.end) covered = true;
                  REXCODEGEN_WARN("VX_CANDIDATE target=0x{:08X} range=[0x{:08X},0x{:08X}) contains={} start_entry={} start_owner=0x{:08X}",
                    target, candidate.start, candidate.end,
                    target >= candidate.start && target < candidate.end,
                    graph.isEntryPoint(candidate.start),
                    graph.getFunctionContaining(candidate.start) ? graph.getFunctionContaining(candidate.start)->base() : 0);
                }
                REXCODEGEN_WARN("VX_CANDIDATE_SUMMARY target=0x{:08X} protected_or_missing={}",
                  target, !covered);
              }
            }
          '''
          if s.count(needle2) != 1:
              raise SystemExit("Could not find unique splitRegion call")
          s = s.replace(needle2, needle2 + diag2)
          needle3 = '  std::sort(protectedRanges.begin(), protectedRanges.end());\n'
          diag3 = r'''  // Temporary diagnostics: identify the exact source of protected bytes.
            constexpr uint32_t vxProtectedTargets[] = {0x829E2470, 0x82221830, 0x82B85AE8,
                0x828A7E40, 0x829E2458, 0x829E2244};
            for (uint32_t target : vxProtectedTargets) {
              for (const auto& [addr, node] : graph.functions()) {
                const int authority = static_cast<int>(node->authority());
                auto emit = [&](const char* kind, uint32_t start, uint32_t end) {
                  if (target >= start && target < end)
                    REXCODEGEN_WARN("VX_PROTECT target=0x{:08X} kind={} owner=0x{:08X} authority={} range=[0x{:08X},0x{:08X})",
                      target, kind, addr, authority, start, end);
                };
                if (node->authority() == FunctionAuthority::CONFIG) {
                  auto it = ctx.Config().functions.find(addr);
                  if (it != ctx.Config().functions.end()) {
                    const uint32_t size = it->second.getSize(addr);
                    if (size && addr + size >= addr) emit("CONFIG", addr, addr + size);
                  }
                }
                if (node->authority() == FunctionAuthority::PDATA) {
                  auto it = scan.pdataSizes.find(addr);
                  if (it != scan.pdataSizes.end() && it->second && addr + it->second >= addr)
                    emit("PDATA", addr, addr + it->second);
                }
                if (node->authority() == FunctionAuthority::HELPER ||
                    node->authority() == FunctionAuthority::IMPORT) {
                  if (node->size() && addr + node->size() >= addr)
                    emit("HELPER_IMPORT", addr, addr + node->size());
                }
                for (const auto& block : node->blocks())
                  if (block.size && block.base + block.size >= block.base)
                    emit("BLOCK", block.base, block.base + block.size);
              }
              for (const auto& range : scan.dataRegions)
                if (target >= range.first && target < range.second)
                  REXCODEGEN_WARN("VX_PROTECT target=0x{:08X} kind=DATA range=[0x{:08X},0x{:08X})",
                    target, range.first, range.second);
            }
          '''
          if s.count(needle3) != 1:
              raise SystemExit("Could not find unique protectedRanges sort insertion point")
          s = s.replace(needle3, diag3 + needle3)
          needle4 = '  auto subtractProtectedRanges = [&](const CodeRegion& segment) {\n'
          diag4 = r'''  for (uint32_t target : vxProtectedTargets) {
            for (const auto& range : mergedRanges) {
              if (target >= range.first && target < range.second)
                REXCODEGEN_WARN("VX_PROTECT_MERGED target=0x{:08X} range=[0x{:08X},0x{:08X})",
                  target, range.first, range.second);
            }
          }

          '''
          if s.count(needle4) != 1:
              raise SystemExit("Could not find unique mergedRanges diagnostic insertion point")
          s = s.replace(needle4, diag4 + needle4)
          p.write_text(s)
          print("Inserted protected-range origin diagnostics.")
          PY

      - name: Add temporary XEX branch-target diagnostics to pinned SDK
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("thirdparty/rexglue-sdk/src/codegen/project_recompiler.cpp")
          s = p.read_text()
          needle = "    contexts.push_back({std::move(ctx), &targeted[0], std::move(entry_display)});"
          diagnostic = r"""
              // Temporary VeronicaX diagnostic: dump loaded PPC words around unresolved targets.
              {
                constexpr uint32_t targets[] = {
                    0x827E9A60, 0x829E2470, 0x823D1438, 0x829E2458, 0x82221830,
                    0x82B85AE8, 0x828A7E40, 0x829E2244, 0x8281D028};
                const auto& binary = ctx.binary();
                for (uint32_t target : targets) {
                  REXCODEGEN_WARN("VX_DISASM target=0x{:08X}", target);
                  for (int32_t delta = -256; delta <= 256; delta += 4) {
                    uint32_t address = static_cast<uint32_t>(target + delta);
                    const uint8_t* bytes = binary.translate(address);
                    if (!bytes) {
                      REXCODEGEN_WARN("VX_DISASM 0x{:08X}: <unmapped>", address);
                      continue;
                    }
                    REXCODEGEN_WARN("VX_DISASM 0x{:08X}: {:02X}{:02X}{:02X}{:02X}",
                                    address, bytes[0], bytes[1], bytes[2], bytes[3]);
                  }
                }
              }
          """
          if s.count(needle) != 1:
              raise SystemExit("Could not uniquely locate entry CodegenContext insertion point")
          p.write_text(s.replace(needle, diagnostic + "\n" + needle))
          print("Inserted temporary loaded-XEX branch-target diagnostics.")
          
          # Add graph ownership diagnostics after Merge and before Validate.
          p = Path("thirdparty/rexglue-sdk/src/codegen/analyze.cpp")
          s = p.read_text()
          needle = '  // 6. Validate\n'
          graph_diag = r"""  // Temporary VeronicaX graph ownership diagnostics.
          {
            constexpr uint32_t targets[] = {
                0x829E2470, 0x823D1438, 0x829E2458, 0x82221830,
                0x82B85AE8, 0x828A7E40, 0x829E2244};
            for (const auto& [base, fn] : ctx.graph.functions()) {
              for (const auto& jump : fn->unresolvedJumps()) {
                bool selected = false;
                for (uint32_t target : targets) selected |= jump.target == target;
                if (!selected) continue;
                auto* owner = ctx.graph.getFunctionContaining(jump.target);
                REXCODEGEN_WARN("VX_GRAPH unresolved source_fn=0x{:08X} site=0x{:08X} target=0x{:08X} source_authority={} target_owner={} target_owner_base=0x{:08X} target_is_entry={}",
                                base, jump.site, jump.target, AuthorityName(fn->authority()),
                                owner ? AuthorityName(owner->authority()) : "none",
                                owner ? owner->base() : 0,
                                ctx.graph.isEntryPoint(jump.target));
                for (const auto& block : fn->blocks())
                  REXCODEGEN_WARN("VX_GRAPH source_block fn=0x{:08X} base=0x{:08X} size=0x{:X}", base, block.base, block.size);
                if (owner)
                  for (const auto& block : owner->blocks())
                    REXCODEGEN_WARN("VX_GRAPH target_block fn=0x{:08X} base=0x{:08X} size=0x{:X}", owner->base(), block.base, block.size);
              }
            }
          }

          """
          if s.count(needle) != 1:
              raise SystemExit("Could not uniquely locate Analyze Validate phase")
          p.write_text(s.replace(needle, graph_diag + needle))
          print("Inserted temporary function-graph ownership diagnostics.")
          PY

      - name: Add PDATA exception and overlapping-owner diagnostics
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("thirdparty/rexglue-sdk/src/codegen/phase_register.cpp")
          s = p.read_text()
          needle = '      exInfo = parseExceptionInfo(binary, beginAddr);\n'
          diag = r"""
                // Temporary VeronicaX: dump exception metadata and all overlapping owners.
                {
                  constexpr uint32_t targets[] = {0x829E2470, 0x82221830, 0x82B85AE8,
                      0x828A7E40, 0x829E2458, 0x829E2244};
                  bool selectedOwner = false;
                  for (uint32_t target : targets)
                    selectedOwner |= target >= beginAddr && target < beginAddr + size;
                  if (selectedOwner) {
                    const auto exceptionFlag = static_cast<uint32_t>(fn.ExceptionFlag);
                    REXCODEGEN_WARN("VX_EH_OWNER base=0x{:08X} size=0x{:X} exception_flag={} parsed={} has_info={} seh={} cxx={}",
                      beginAddr, size, exceptionFlag, exInfo.has_value(),
                      exInfo && exInfo->info.hasInfo(),
                      exInfo && exInfo->info.isSeh(), exInfo && exInfo->info.isCxx());
                    if (exInfo) {
                      if (const auto* seh = exInfo->info.asSeh()) {
                        REXCODEGEN_WARN("VX_EH_SEH owner=0x{:08X} thunk=0x{:08X} scope_table=0x{:08X} scopes={}",
                          beginAddr, seh->handlerThunk, seh->scopeTableAddr, seh->scopes.size());
                        for (const auto& scope : seh->scopes)
                          REXCODEGEN_WARN("VX_EH_SCOPE owner=0x{:08X} try=[0x{:08X},0x{:08X}) filter=0x{:08X} handler=0x{:08X}",
                            beginAddr, scope.tryStart, scope.tryEnd, scope.filter, scope.handler);
                      } else if (const auto* cxx = exInfo->info.asCxx()) {
                        REXCODEGEN_WARN("VX_EH_CXX owner=0x{:08X} thunk=0x{:08X} func_info=0x{:08X} unwind_entries={} try_blocks={}",
                          beginAddr, cxx->handlerThunk, cxx->funcInfoAddr,
                          cxx->unwindMap.size(), cxx->tryBlocks.size());
                        for (const auto& entry : cxx->unwindMap)
                          REXCODEGEN_WARN("VX_EH_UNWIND owner=0x{:08X} action=0x{:08X} to_state={}",
                            beginAddr, entry.action, entry.toState);
                        for (const auto& block : cxx->tryBlocks)
                          for (const auto& handler : block.handlers)
                            REXCODEGEN_WARN("VX_EH_HANDLER owner=0x{:08X} address=0x{:08X} try_low={} try_high={} catch_high={}",
                              beginAddr, handler.handlerAddress, block.tryLow, block.tryHigh, block.catchHigh);
                      }
                    }
                  }
                  for (uint32_t target : targets) {
                    if (target < beginAddr || target >= beginAddr + size) continue;
                    for (const auto& [candidateBase, candidate] : graph.functions()) {
                      if (candidate->containsAddress(target))
                        REXCODEGEN_WARN("VX_OWNER_CANDIDATE target=0x{:08X} base=0x{:08X} end=0x{:08X} authority={}",
                          target, candidateBase, candidate->end(),
                          static_cast<int>(candidate->authority()));
                    }
                  }
                }
          """
          if s.count(needle) != 1:
              raise SystemExit("Could not uniquely locate parseExceptionInfo insertion point")
          p.write_text(s.replace(needle, needle + diag))
          print("Inserted PDATA SEH/C++ EH and overlapping-owner diagnostics.")
          PY

      - name: Build pinned ReXGlue host codegen
        working-directory: thirdparty/rexglue-sdk
        run: |
          set -euo pipefail
          # Clang 18 advertises an older concepts feature level than libstdc++ 14 expects.
          # Verify and enable the C++23 library feature gate for std::expected.
          printf '#include <expected>\nint main() { std::expected<int, int> value = 1; return value.value() - 1; }\n' | \
            clang++ --gcc-toolchain=/usr -stdlib=libstdc++ -std=c++23 -D__cpp_concepts=202002L -x c++ -fsyntax-only -
          clang++ --gcc-toolchain=/usr -v -E -x c++ /dev/null -o /dev/null
          cmake --preset linux-amd64 \
            -DCMAKE_CXX_FLAGS="--gcc-toolchain=/usr -march=x86-64-v2 -stdlib=libstdc++ -D__cpp_concepts=202002L" \
            -DCMAKE_EXE_LINKER_FLAGS="--gcc-toolchain=/usr -stdlib=libstdc++" \
            -DCMAKE_SHARED_LINKER_FLAGS="--gcc-toolchain=/usr -stdlib=libstdc++"
          cmake --build --preset linux-amd64-release --target rexglue --parallel 2

      - name: Run VeronicaX codegen
        shell: bash
        run: |
          set -euo pipefail
          SDK_BIN="thirdparty/rexglue-sdk/out/linux-amd64/Release/rexglue"
          if [[ ! -x "$SDK_BIN" ]]; then
            SDK_BIN="thirdparty/rexglue-sdk/out/linux-amd64/rexglue"
          fi
          test -x "$SDK_BIN"
          "$SDK_BIN" codegen veronicax_manifest.toml

      - name: Verify generated CMake and sources
        shell: bash
        run: |
          set -euo pipefail
          test -s generated/default/sources.cmake
          test -s generated/default/codegen.build.stamp
          test -s generated/default/veronicax_pch.h
          grep -q 'set(GENERATED_SOURCES' generated/default/sources.cmake
          echo "Codegen output verified."
          find generated/default -maxdepth 1 -type f -printf '%f %s bytes\\n' | sort

      - name: Remove private game input
        if: always()
        run: |
          rm -rf private-game-input game/extracted/Default.xex
